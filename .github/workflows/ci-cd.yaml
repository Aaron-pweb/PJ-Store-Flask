name: CI/CD Pipeline

# Trigger the workflow on every push to the repository
on: [push]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment (matching your Dockerfile)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up builds by caching dependencies

      # Step 3: Install dependencies from your requirements file
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest # Ensures your testing framework is available

      # Step 4: Run the tests
      - name: Run Tests
        run: |
          pytest
        env:
          # Provide a mock database URL so tests don't fail trying to connect to PostgreSQL
          DATABASE_URL: sqlite:///test_default.db
